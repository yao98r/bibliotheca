<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下載 · Bibliotheca</title><style>body{font:16px system-ui;background:#f3ead9;color:#302820;margin:0;padding:10vh 8vw}h1{font:36px Georgia,serif}p{line-height:1.8}a{color:#805236}button{padding:12px 18px;cursor:pointer;background:#805236;color:white;border:0}body{max-width:780px;margin:0 auto;padding:6vh 24px}fieldset{border:1px solid #cfbfa8;border-radius:8px;padding:20px;margin:24px 0}legend{padding:0 8px;font-size:15px}label.choice{display:block;padding:12px 0;font-weight:600}label.choice small{display:block;margin:5px 0 0 24px;font-weight:400;font-size:13px;color:#806d5a}input[type=radio],input[type=checkbox]{accent-color:#805236;margin-right:8px}#enhanceOptions{padding:15px 20px;background:#e9ddc9;border-radius:6px;font-size:14px}select{padding:7px 10px;margin:0 8px 12px;border:1px solid #bfaa8f;background:#fff8eb;border-radius:4px}button{border-radius:5px}button:disabled{opacity:.5;cursor:default}#downloadBtn{min-width:180px}progress{display:block;width:100%;height:8px;accent-color:#805236;margin:20px 0}progress[hidden],#enhanceOptions[hidden],[hidden]{display:none!important}.hint{font-size:13px;color:#806d5a}</style></head><body><h1>Bibliotheca</h1><p id="status" role="status">正在確認權限並準備 PDF，較大的檔案需要一些時間…</p><p id="fileTitle"></p><fieldset id="quality"><legend>下載畫質</legend><label class="choice"><input type="radio" name="quality" value="original" checked>原始畫質<small>直接下載目前這份 PDF。</small></label><label class="choice"><input id="enhanceQuality" type="radio" name="quality" value="enhanced" disabled>畫質增強<small>由天河增強系統在伺服器去浮水印與增強，系統自動分流。</small></label><div id="enhanceOptions" hidden><label>目標解析度<select id="dpi"><option value="300">300 DPI · 日常閱讀</option><option value="600">600 DPI · 細節列印</option><option value="800">800 DPI · 高精細輸出</option></select></label><label style="display:block"><input id="removeWatermarks" type="checkbox" checked>去除可辨識文字與註解浮水印</label><p class="hint">每份上限 20 MB、100 頁。圖片中燒錄的水印會保留；放大不會恢復已遺失的細節。</p></div></fieldset><p id="serviceNote" class="hint"></p><button id="downloadBtn" disabled>下載 PDF</button> <button id="retry" hidden>重試下載</button><progress id="enhancementProgress" max="100" value="0" hidden></progress><p><a href="./">回到書庫</a></p><script>const BACKEND='https://tianyan-books.yao98r.chatgpt.site';
const STORAGE_KEY='bibliotheca-session-v1';
const PENDING_LOGIN_KEY='bibliotheca-login-';
async function exchangeLogin(code,state,verifier){
 if(!/^[\w-]{43}$/.test(code||'')||!/^[\w-]{43}$/.test(state||'')||!/^[\w-]{64}$/.test(verifier||''))throw Error('登入資料無效，請重新登入。');
 const response=await fetch(BACKEND+'/api/exchange',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',cache:'no-store',redirect:'error',body:JSON.stringify({code,state,verifier})});
 const data=await response.json();if(!response.ok)throw Error(data.error||'登入驗證失敗');
 if(!data.token||!(data.expiresAt>Date.now()/1000))throw Error('登入驗證失敗，請重新登入。');
 data.loginState=state;localStorage.setItem(STORAGE_KEY,JSON.stringify(data));sessionStorage.removeItem(STORAGE_KEY);return data;
}
async function completeRedirectLogin(){
 if(new URLSearchParams(location.search).get('login_callback')!=='1')return false;
 const fragment=new URLSearchParams(location.hash.slice(1)),code=fragment.get('code'),state=fragment.get('state');
 const clean=new URL(location.href);clean.searchParams.delete('login_callback');clean.hash='';history.replaceState(null,'',clean.href);
 if(!/^[\w-]{43}$/.test(state||''))throw Error('登入資料無效，請回到原本的書庫重新登入。');
 const key=PENDING_LOGIN_KEY+state;let pending;try{pending=JSON.parse(localStorage.getItem(key)||'null');}catch{}
 if(!pending||pending.state!==state||pending.expiresAt<=Date.now()) {localStorage.removeItem(key);throw Error('登入已逾時，請回到原本的書庫重新登入。');}
 try{await exchangeLogin(code,state,pending.verifier);}finally{localStorage.removeItem(key);}
 return true;
}
function savedSession(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||sessionStorage.getItem(STORAGE_KEY)||'null');if(value?.token&&value.expiresAt>Date.now()/1000){localStorage.setItem(STORAGE_KEY,JSON.stringify(value));sessionStorage.removeItem(STORAGE_KEY);return value;}}catch{}clearSession();return null;}
function clearSession(){localStorage.removeItem(STORAGE_KEY);sessionStorage.removeItem(STORAGE_KEY);}
function localRoute(value){const u=new URL(value,BACKEND);if(u.origin!==BACKEND)throw Error('無效的書籍入口');const routes={'/':'./','/go':'go.html','/files':'files.html','/access':'access.html','/viewer':'viewer.html','/file':'download.html'};if(!(u.pathname in routes))throw Error('無效的書籍入口');return routes[u.pathname]+u.search;}
async function authorizedFetch(path,options={}){if(!/^\/(?:api\/|file\?)/.test(path))throw Error('無效的操作入口');const headers=new Headers(options.headers);const session=savedSession();if(session)headers.set('Authorization','Bearer '+session.token);return fetch(BACKEND+path,{...options,headers,credentials:'omit',cache:'no-store',redirect:'error'});}
async function remoteApi(path,body){const response=await authorizedFetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const result=await response.json();if(!response.ok){const e=Error(result.error||'操作暫時無法完成');e.status=response.status;if(e.status===401)clearSession();throw e;}if(result.url)result.url=localRoute(result.url);return result;}
function requireLogin(){const target=location.pathname.split('/').pop()+location.search;location.replace('./?return='+encodeURIComponent(target));}
function returnAfterLogin(){const target=new URLSearchParams(location.search).get('return');if(!target)return false;const u=new URL(target,location.href),base=new URL('./',location.href);if(u.origin===base.origin&&u.pathname.startsWith(base.pathname)&&/\/(?:go|files|access|viewer|download)\.html$/.test(u.pathname)){location.replace(u.href);return true;}return false;}
async function startLogin(onSuccess,onError){
 const popup=window.open('about:blank','bibliotheca-google-login','width=520,height=720');if(!popup){onError(Error('請允許登入視窗，再按一次登入。'));return;}
 const encode=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const state=encode(crypto.getRandomValues(new Uint8Array(32))),verifier=encode(crypto.getRandomValues(new Uint8Array(48))),challenge=encode(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
 const pendingKey=PENDING_LOGIN_KEY+state;
 try{localStorage.setItem(pendingKey,JSON.stringify({state,verifier,expiresAt:Date.now()+600000}));}catch{popup.close();onError(Error('請允許此網站儲存登入資料，再重新登入。'));return;}
 let ended=false;const cleanup=()=>{ended=true;window.removeEventListener('message',receive);window.removeEventListener('storage',receiveStorage);clearTimeout(timeout);localStorage.removeItem(pendingKey);};
 const receive=async event=>{if(ended||event.origin!==BACKEND||event.source!==popup||event.data?.type!=='bibliotheca-login'||event.data.state!==state)return;cleanup();try{await exchangeLogin(event.data.code,state,verifier);popup.close();await onSuccess();}catch(e){onError(e);}};
 const receiveStorage=async event=>{if(ended||event.storageArea!==localStorage||event.key!==STORAGE_KEY)return;let session;try{session=JSON.parse(event.newValue);}catch{return;}if(session?.loginState!==state||!session.token||!(session.expiresAt>Date.now()/1000))return;cleanup();try{await onSuccess();}catch(e){onError(e);}};
 window.addEventListener('message',receive);window.addEventListener('storage',receiveStorage);
 // A browser may report closed after isolating a Google popup. Keep the redirect handoff available until its deadline.
 const timeout=setTimeout(()=>{if(ended)return;cleanup();popup.close();onError(Error('登入已逾時，請重新登入。'));},600000);
 popup.location=BACKEND+'/auth?'+new URLSearchParams({state,challenge});
}
async function savePdf(path){
 const ticket=new URLSearchParams(location.search).get('ticket')||'';
 const context=await remoteApi('/api/download-context?ticket='+encodeURIComponent(ticket));
 const response=await authorizedFetch(path);if(!response.ok){const data=await response.json().catch(()=>({}));const e=Error(data.error||'下載未完成，請重試');e.status=response.status;throw e;}
 const bytes=new Uint8Array(await response.arrayBuffer()),expected=response.headers.get('X-PDF-Bytes');if(!bytes.length||expected!==null&&bytes.length!==Number(expected))throw Error('PDF 傳輸中斷，請重新下載。');
 const watermark=response.headers.get('X-PDF-Watermark');let output=bytes;
 // Compatibility during deployment: upgraded backends always deliver a
 // composed document, which is saved byte-for-byte without loading PDF-LIB.
 if(!watermark||watermark==='legacy'){const {stampPdf}=await import('./assets/trace-watermark.mjs'),PDFLib=await import('./assets/pdf-lib.esm.min.js');output=await stampPdf(bytes,context.traceCode,{PDFLib,onProgress:(n,total)=>{document.getElementById('status').textContent='正在準備 PDF：'+n+'／'+total+' 頁';}});}
 else if(watermark!=='server-v2')throw Error('PDF 保護版本不符，請重新取得下載入口。');
 const blob=new Blob([output],{type:'application/pdf'}),header=response.headers.get('Content-Disposition')||'';let name=context.title||'TSEA.pdf';const utf=header.match(/filename\*=UTF-8''([^;]+)/i);if(utf)try{name=decodeURIComponent(utf[1]);}catch{}
 const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

const message=document.getElementById('status'),retry=document.getElementById('retry'),downloadBtn=document.getElementById('downloadBtn'),bar=document.getElementById('enhancementProgress'),ticketValue=new URLSearchParams(location.search).get('ticket')||'',jobKey='bibliotheca-tianhe:'+ticketValue;
let currentUser=null,running=false,serviceEnabled=false;const quality=()=>document.querySelector('[name="quality"]:checked').value;
function updateChoice(){document.getElementById('enhanceOptions').hidden=quality()!=='enhanced';downloadBtn.textContent=quality()==='enhanced'?(sessionStorage.getItem(jobKey)?'繼續增強並下載':'增強後下載 PDF'):'下載原始畫質';}
document.querySelectorAll('[name="quality"]').forEach(input=>input.onchange=updateChoice);
function saveBlob(bytes,header,fallback){let name=fallback;const utf=(header||'').match(/filename\*=UTF-8''([^;]+)/i);if(utf)try{name=decodeURIComponent(utf[1]);}catch{}const href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=href;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(href),60000);}
async function enhancedDownload(){
 let jobToken=sessionStorage.getItem(jobKey),state;
 if(!jobToken){message.textContent='正在將 PDF 傳送至天河增強系統…';state=await remoteApi('/api/enhance/start',{csrf:currentUser.csrf,ticket:ticketValue,dpi:Number(document.getElementById('dpi').value),removeWatermarks:document.getElementById('removeWatermarks').checked});jobToken=state.jobToken;sessionStorage.setItem(jobKey,jobToken);}
 bar.hidden=false;let count=0;
 for(;;){state=await remoteApi('/api/enhance/step',{csrf:currentUser.csrf,jobToken});bar.value=state.progress;const names={analyze:'去浮水印與分析',enhance:'分塊增強',assemble:'組裝 PDF',verify:'逐頁驗證',done:'處理完成'};message.textContent='天河增強系統：'+(names[state.stage]||'處理中')+' · '+state.progress+'%';if(state.stage==='failed'){sessionStorage.removeItem(jobKey);throw Error(state.error||'增強未完成，請重試或下載原始畫質。');}if(state.stage==='done')break;if(++count>1000)throw Error('工作尚未完成，稍後可按繼續增強。');}
 const response=await authorizedFetch('/api/enhance/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csrf:currentUser.csrf,jobToken})});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||'增強成品下載未完成，請重試。');}const bytes=new Uint8Array(await response.arrayBuffer()),expected=response.headers.get('X-PDF-Bytes');if(!bytes.length||expected&&bytes.length!==Number(expected))throw Error('成品傳輸中斷，請重試下載。');saveBlob(bytes,response.headers.get('Content-Disposition'),'天河增強.pdf');sessionStorage.removeItem(jobKey);
}
async function download(){if(running)return;running=true;retry.hidden=true;downloadBtn.disabled=true;document.querySelectorAll('#quality input,#quality select').forEach(x=>x.disabled=true);try{if(quality()==='enhanced')await enhancedDownload();else await savePdf('/file'+location.search);message.textContent='檔案已交由瀏覽器儲存。若未出現，請檢查瀏覽器的下載清單。';retry.textContent='再次下載';retry.hidden=false;}catch(e){if(e.status===401){requireLogin();return;}message.textContent=e.message;retry.hidden=false;}finally{running=false;downloadBtn.disabled=false;document.querySelectorAll('#quality input,#quality select').forEach(x=>x.disabled=false);document.getElementById('enhanceQuality').disabled=!serviceEnabled;updateChoice();}}
async function init(){try{await completeRedirectLogin();currentUser=await remoteApi('/api/me');const context=await remoteApi('/api/download-context?ticket='+encodeURIComponent(ticketValue));document.getElementById('fileTitle').textContent=context.title||'PDF 文件';const feature=await remoteApi('/api/enhance/config').catch(()=>({enabled:false}));serviceEnabled=!!feature.enabled;document.getElementById('enhanceQuality').disabled=!feature.enabled;document.getElementById('serviceNote').textContent=feature.enabled?'畫質增強會由伺服器完成，不需要重新選檔。':'原始畫質可直接下載；天河增強服務目前尚未開放。';if(feature.enabled&&sessionStorage.getItem(jobKey))document.getElementById('enhanceQuality').checked=true;downloadBtn.disabled=false;message.textContent='請選擇下載畫質。';updateChoice();}catch(e){if(e.status===401){requireLogin();return;}message.textContent=e.message;retry.hidden=false;}}
retry.onclick=()=>currentUser?download():init();downloadBtn.onclick=download;init();</script></body></html>
