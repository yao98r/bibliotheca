<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>閱覽室 · Bibliotheca</title><style>
:root{color-scheme:light;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#302820;background:#f1e4cd}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:1;background:#25231e;color:#eed7b0;padding:16px 24px;box-shadow:0 2px 12px #0002}header>div{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}a{color:inherit}h1{font-size:16px;font-weight:500;flex:1;margin:0;overflow-wrap:anywhere}button,input{font:inherit;padding:9px 12px;background:#f8efdd;border:1px solid #a4753b;border-radius:3px;color:#302820}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{width:74px;text-align:center}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px auto;max-width:1200px;padding:0 18px}.controls span{font-size:13px}#status{max-width:1200px;margin:16px auto;padding:0 20px;color:#783522;font-size:14px;white-space:pre-wrap}main{max-width:1200px;margin:0 auto 40px;padding:0 12px;text-align:center;overflow:auto}canvas{display:block;max-width:100%;height:auto;margin:auto;background:white;box-shadow:0 4px 24px #30282026}#reload{display:none}.note{font-size:12px;color:#75614f;padding:0 20px;max-width:1200px;margin:14px auto}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c78251;outline-offset:2px}@media print{body>*{display:none!important}body:before{content:"請在 Bibliotheca 線上閱覽。"}}
.privilege[hidden]{display:none}.privilege{display:flex;align-items:center;gap:20px;max-width:1160px;margin:20px auto 12px;padding:20px 26px;border:1px solid #b99257;border-left:4px solid #a46938;background:linear-gradient(110deg,#ead6ad,#f5e9cc);animation:arrive .6s ease-out}.seal{display:grid;place-items:center;flex:0 0 50px;height:50px;border:1px solid #b28a51;border-radius:50%;font-size:28px;color:#946034}.privilege small{font:10px Georgia,serif;letter-spacing:2px;color:#8b663d}.privilege h2{font-size:19px;font-weight:500;line-height:1.6;color:#624022;margin:4px 0}.privilege p{font-size:13px;color:#65472f;margin:4px 0;line-height:1.8}.privilege .blessing{font-size:12px;color:#876c4c}@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:760px){.privilege{margin:14px 12px;padding:16px;gap:16px}.seal{flex-basis:34px;height:34px;font-size:22px}.privilege h2{font-size:17px}}@media(prefers-reduced-motion:reduce){.privilege{animation:none}}
</style></head><body><header><div><a href="./">Bibliotheca</a><h1 id="title">正在確認閱覽權限…</h1><button id="download" hidden>下載 PDF</button></div></header><aside id="privilege" class="privilege" hidden aria-label="專屬閱覽通行"><span class="seal" aria-hidden="true">✦</span><div><small>ADITUS PRIVILEGIATUS</small><h2>超級閱覽權限已啟用</h2><p id="privilegeGreeting"></p><p id="privilegeMessage" class="blessing">這一卷，正在為你展開。願每一次翻頁，都離答案更近。</p></div></aside><div class="controls" id="controls" hidden><button id="prev">上一頁</button><label>第 <input id="number" type="number" min="1" value="1" aria-label="頁碼"> 頁</label><span id="total"></span><button id="next">下一頁</button><button id="reload">重新載入</button></div><p id="status" role="status" aria-live="polite"></p><p id="note" class="note" hidden>逐頁載入受控閱覽內容。檔案可能包含授權識別碼；使用紀錄僅供管理者查看。</p><main><canvas id="page" hidden></canvas></main><script type="module">const BACKEND='https://bibliotheca-backend.bibliotheca-cloudflare.workers.dev';
const STORAGE_KEY='bibliotheca-cloudflare-session-v1';
const PENDING_LOGIN_KEY='bibliotheca-login-';
async function exchangeLogin(code,state,verifier){
 if(!/^[\w-]{43}$/.test(code||'')||!/^[\w-]{43}$/.test(state||'')||!/^[\w-]{64}$/.test(verifier||''))throw Error('登入資料無效，請重新登入。');
 const response=await fetch(BACKEND+'/api/exchange',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',cache:'no-store',redirect:'error',body:JSON.stringify({code,state,verifier})});
 const data=await response.json();if(!response.ok)throw Error(data.error||'登入驗證失敗');
 if(!data.token||!(data.expiresAt>Date.now()/1000))throw Error('登入驗證失敗，請重新登入。');
 data.loginState=state;localStorage.setItem(STORAGE_KEY,JSON.stringify(data));sessionStorage.removeItem(STORAGE_KEY);return data;
}
async function completeRedirectLogin(){
 if(new URLSearchParams(location.search).get('login_callback')!=='1')return false;
 const fragment=new URLSearchParams(location.hash.slice(1)),code=fragment.get('code'),state=fragment.get('state');
 const clean=new URL(location.href);clean.searchParams.delete('login_callback');clean.hash='';history.replaceState(null,'',clean.href);
 if(!/^[\w-]{43}$/.test(state||''))throw Error('登入資料無效，請回到原本的書庫重新登入。');
 const key=PENDING_LOGIN_KEY+state;let pending;try{pending=JSON.parse(localStorage.getItem(key)||'null');}catch{}
 if(!pending||pending.state!==state||pending.expiresAt<=Date.now()) {localStorage.removeItem(key);throw Error('登入已逾時，請回到原本的書庫重新登入。');}
 try{await exchangeLogin(code,state,pending.verifier);}finally{localStorage.removeItem(key);}
 return true;
}
function savedSession(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||sessionStorage.getItem(STORAGE_KEY)||'null');if(value?.token&&value.expiresAt>Date.now()/1000){localStorage.setItem(STORAGE_KEY,JSON.stringify(value));sessionStorage.removeItem(STORAGE_KEY);return value;}}catch{}clearSession();return null;}
function clearSession(){localStorage.removeItem(STORAGE_KEY);sessionStorage.removeItem(STORAGE_KEY);}
function localRoute(value){const u=new URL(value,BACKEND);if(u.origin!==BACKEND)throw Error('無效的書籍入口');const routes={'/':'./','/go':'go.html','/files':'files.html','/access':'access.html','/viewer':'viewer.html','/file':'download.html'};if(!(u.pathname in routes))throw Error('無效的書籍入口');return routes[u.pathname]+u.search;}
async function authorizedFetch(path,options={}){if(!/^\/(?:api\/|file\?)/.test(path))throw Error('無效的操作入口');const headers=new Headers(options.headers);const session=savedSession();if(session)headers.set('Authorization','Bearer '+session.token);return fetch(BACKEND+path,{...options,headers,credentials:'omit',cache:'no-store',redirect:'error'});}
async function remoteApi(path,body){const response=await authorizedFetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const result=await response.json();if(!response.ok){const e=Error(result.error||'操作暫時無法完成');e.status=response.status;if(e.status===401)clearSession();throw e;}if(result.url)result.url=localRoute(result.url);return result;}
function requireLogin(){const target=location.pathname.split('/').pop()+location.search;location.replace('./?return='+encodeURIComponent(target));}
function returnAfterLogin(){const target=new URLSearchParams(location.search).get('return');if(!target)return false;const u=new URL(target,location.href),base=new URL('./',location.href);if(u.origin===base.origin&&u.pathname.startsWith(base.pathname)&&/\/(?:go|files|access|viewer|download)\.html$/.test(u.pathname)){location.replace(u.href);return true;}return false;}
async function startLogin(onSuccess,onError){
 try {
 const encode=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const state=encode(crypto.getRandomValues(new Uint8Array(32))),verifier=encode(crypto.getRandomValues(new Uint8Array(48))),challenge=encode(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
 localStorage.setItem(PENDING_LOGIN_KEY+state,JSON.stringify({state,verifier,expiresAt:Date.now()+600000}));
 const returnTo=new URL('./',location.href).href;
 const after=new URLSearchParams(location.search).get('return');if(after)sessionStorage.setItem('bibliotheca-after-login',after);
 location.href=BACKEND+'/auth?'+new URLSearchParams({state,challenge,return_to:returnTo});
 }catch(e){onError(e);}
}
async function savePdf(path){const response=await authorizedFetch(path);if(!response.ok){const data=await response.json().catch(()=>({}));const e=Error(data.error||'下載未完成，請重試');e.status=response.status;throw e;}const blob=await response.blob();const expected=response.headers.get('X-PDF-Bytes');if(expected!==null&&blob.size!==Number(expected))throw Error('PDF 傳輸中斷，請重新下載。');if(!blob.size)throw Error('檔案尚未取得，請重試');const header=response.headers.get('Content-Disposition')||'';let name='Bibliotheca.pdf';const utf=header.match(/filename\*=UTF-8''([^;]+)/i),plain=header.match(/filename="([^"]+)"/i);try{name=utf?decodeURIComponent(utf[1]):plain?.[1]||name;}catch{}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}


const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let me,data,pdfjs,page=1,loading=false,fastDoc=null;
async function api(path,body){return remoteApi(path,body);}
const fetchPdf=path=>authorizedFetch(path);
function pdfOptions(bytes){return {data:bytes,isEvalSupported:false,useSystemFonts:true,cMapUrl:'./assets/cmaps/',cMapPacked:true,standardFontDataUrl:'./assets/standard_fonts/',wasmUrl:'./assets/wasm/',disableAutoFetch:true,disableStream:true};}
async function pdfBytes(path){const response=await fetchPdf(path);if(!response.ok){const error=await response.json();throw Error(error.error||'無法載入檔案');}const bytes=new Uint8Array(await response.arrayBuffer());const expected=response.headers.get('X-PDF-Bytes');if(expected!==null&&bytes.length!==Number(expected))throw Error('PDF 傳輸中斷，請重新載入。');return bytes;}
async function display(n){
 if(loading)return;loading=true;$('prev').disabled=$('next').disabled=true;$('page').hidden=true;let doc;
 try{
  if(data.readingMode==='fast'){
   if(!fastDoc){$('status').textContent='首次正在載入整本 PDF；大型書籍需要較長時間，完成後翻頁不再重新取檔…';const bytes=await pdfBytes('/api/fast-file?ticket='+encodeURIComponent(params.get('ticket')));fastDoc=await pdfjs.getDocument(pdfOptions(bytes)).promise;if(fastDoc.numPages!==data.pages){await fastDoc.loadingTask.destroy();fastDoc=null;throw Error('書籍頁數已變更，請重新開啟。');}}
   doc=fastDoc;$('status').textContent='正在顯示第 '+n+' 頁…';
  }else{$('status').textContent='正在載入第 '+n+' 頁…';const bytes=await pdfBytes('/api/page?'+new URLSearchParams({ticket:params.get('ticket'),page:n}));doc=await pdfjs.getDocument(pdfOptions(bytes)).promise;}
  const source=await doc.getPage(fastDoc?n:1),initial=source.getViewport({scale:1}),width=Math.min(1160,Math.max(320,innerWidth-24)),scale=Math.min(2,width/initial.width)*(devicePixelRatio>1?Math.min(2,devicePixelRatio):1),viewport=source.getViewport({scale}),canvas=$('page');canvas.width=viewport.width;canvas.height=viewport.height;canvas.style.width=Math.round(viewport.width/Math.min(2,devicePixelRatio||1))+'px';await source.render({canvasContext:canvas.getContext('2d'),viewport}).promise;source.cleanup();page=n;$('number').value=n;canvas.hidden=false;$('status').textContent='';$('reload').style.display='none';if(fastDoc)$('privilegeMessage').textContent='藏書已展開，即刻自由翻閱。願每一次翻頁，都離答案更近。';if(fastDoc)$('note').textContent='整本已準備完成，翻頁不需重新取檔。內容含授權識別碼；關閉頁面後會清除本次閱覽快取。';
 }catch(e){$('status').textContent=e.message;$('reload').style.display='inline-block';}
 finally{if(doc&&doc!==fastDoc)await doc.loadingTask.destroy();loading=false;$('prev').disabled=page<=1;$('next').disabled=page>=data.pages;}
}

try{me=await api('/api/me');if(location.pathname.endsWith('/access.html')){const result=await api('/api/prepare',{csrf:me.csrf,bookId:params.get('book'),action:params.get('action')||'open',...(params.get('asset')?{asset:params.get('asset')}:{})});location.replace(result.url);}else{data=await api('/api/viewer?ticket='+encodeURIComponent(params.get('ticket')||''));$('title').textContent=data.title;document.title=data.title+' · Bibliotheca';$('total').textContent='共 '+data.pages+' 頁';$('number').max=data.pages;$('controls').hidden=$('note').hidden=false;$('download').hidden=!data.canDownload;if(data.readingMode==='fast'){$('privilegeGreeting').textContent='歡迎回來，'+me.name+'。你的專屬書席已就緒。';$('privilege').hidden=false;}pdfjs=await import('./assets/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='./assets/pdf.worker.min.mjs';await display(1);}}
catch(e){if(e.status===401)requireLogin();$('title').textContent='目前無法開啟';$('status').textContent=e.message;}
$('prev').onclick=()=>display(page-1);$('next').onclick=()=>display(page+1);$('reload').onclick=()=>display(Number($('number').value)||page);$('number').onchange=()=>{const n=Number($('number').value);if(Number.isInteger(n)&&n>=1&&n<=data.pages)display(n);else $('number').value=page;};
$('download').onclick=async()=>{$('download').disabled=true;try{const result=await api('/api/viewer/download',{csrf:me.csrf,ticket:params.get('ticket')});location.href=result.url;}catch(e){$('status').textContent=e.message;}finally{$('download').disabled=false;}};
</script></body></html>
