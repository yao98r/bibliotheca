<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>閱覽室 · Bibliotheca</title><style>
:root{color-scheme:light;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#302820;background:#f1e4cd}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:1;background:#25231e;color:#eed7b0;padding:16px 24px;box-shadow:0 2px 12px #0002}header>div{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}a{color:inherit}h1{font-size:16px;font-weight:500;flex:1;margin:0;overflow-wrap:anywhere}button,input{font:inherit;padding:9px 12px;background:#f8efdd;border:1px solid #a4753b;border-radius:3px;color:#302820}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{width:74px;text-align:center}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px auto;max-width:1200px;padding:0 18px}.controls span{font-size:13px}#status{max-width:1200px;margin:16px auto;padding:0 20px;color:#783522;font-size:14px;white-space:pre-wrap}main{max-width:1200px;margin:0 auto 40px;padding:0 12px;text-align:center;overflow:auto}canvas{display:block;max-width:100%;height:auto;margin:auto;background:white;box-shadow:0 4px 24px #30282026}#reload{display:none}.note{font-size:12px;color:#75614f;padding:0 20px;max-width:1200px;margin:14px auto}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c78251;outline-offset:2px}@media print{body>*{display:none!important}body:before{content:"請在 Bibliotheca 線上閱覽。"}}
</style></head><body><header><div><a href="./">Bibliotheca</a><h1 id="title">正在確認閱覽權限…</h1><button id="download" hidden>下載 PDF</button></div></header><div class="controls" id="controls" hidden><button id="prev">上一頁</button><label>第 <input id="number" type="number" min="1" value="1" aria-label="頁碼"> 頁</label><span id="total"></span><button id="next">下一頁</button><button id="reload">重新載入</button></div><p id="status" role="status" aria-live="polite"></p><p id="note" class="note" hidden>逐頁載入受控閱覽內容。檔案可能包含授權識別碼；使用紀錄僅供管理者查看。</p><main><canvas id="page" hidden></canvas></main><script type="module">const BACKEND='https://tianyan-books.yao98r.chatgpt.site';
const STORAGE_KEY='bibliotheca-session-v1';
function savedSession(){try{const value=JSON.parse(sessionStorage.getItem(STORAGE_KEY)||'null');if(value?.token&&value.expiresAt>Date.now()/1000)return value;}catch{}sessionStorage.removeItem(STORAGE_KEY);return null;}
function clearSession(){sessionStorage.removeItem(STORAGE_KEY);}
function localRoute(value){const u=new URL(value,BACKEND);if(u.origin!==BACKEND)throw Error('無效的書籍入口');const routes={'/':'./','/go':'go.html','/files':'files.html','/access':'access.html','/viewer':'viewer.html','/file':'download.html'};if(!(u.pathname in routes))throw Error('無效的書籍入口');return routes[u.pathname]+u.search;}
async function authorizedFetch(path,options={}){if(!/^\/(?:api\/|file\?)/.test(path))throw Error('無效的操作入口');const headers=new Headers(options.headers);const session=savedSession();if(session)headers.set('Authorization','Bearer '+session.token);return fetch(BACKEND+path,{...options,headers,credentials:'omit',cache:'no-store',redirect:'error'});}
async function remoteApi(path,body){const response=await authorizedFetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const result=await response.json();if(!response.ok){const e=Error(result.error||'操作暫時無法完成');e.status=response.status;if(e.status===401)clearSession();throw e;}if(result.url)result.url=localRoute(result.url);return result;}
function requireLogin(){const target=location.pathname.split('/').pop()+location.search;location.replace('./?return='+encodeURIComponent(target));}
function returnAfterLogin(){const target=new URLSearchParams(location.search).get('return');if(!target)return false;const u=new URL(target,location.href),base=new URL('./',location.href);if(u.origin===base.origin&&u.pathname.startsWith(base.pathname)&&/\/(?:go|files|access|viewer|download)\.html$/.test(u.pathname)){location.replace(u.href);return true;}return false;}
async function startLogin(onSuccess,onError){
 const popup=window.open('about:blank','bibliotheca-google-login','width=520,height=720');if(!popup){onError(Error('請允許登入視窗，再按一次登入。'));return;}
 const encode=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const state=encode(crypto.getRandomValues(new Uint8Array(32))),verifier=encode(crypto.getRandomValues(new Uint8Array(48))),challenge=encode(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
 let ended=false;const cleanup=()=>{ended=true;window.removeEventListener('message',receive);clearInterval(watch);clearTimeout(timeout);};
 const receive=async event=>{if(ended||event.origin!==BACKEND||event.source!==popup||event.data?.type!=='bibliotheca-login'||event.data.state!==state)return;cleanup();try{const response=await fetch(BACKEND+'/api/exchange',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',cache:'no-store',redirect:'error',body:JSON.stringify({code:event.data.code,state,verifier})});const data=await response.json();if(!response.ok)throw Error(data.error||'登入驗證失敗');sessionStorage.setItem(STORAGE_KEY,JSON.stringify(data));popup.close();await onSuccess();}catch(e){onError(e);}};
 window.addEventListener('message',receive);const watch=setInterval(()=>{if(popup.closed&&!ended){cleanup();onError(Error('登入視窗已關閉，請再按一次登入。'));}},1000),timeout=setTimeout(()=>{cleanup();popup.close();onError(Error('登入已逾時，請重新登入。'));},600000);
 popup.location=BACKEND+'/auth?'+new URLSearchParams({state,challenge});
}
async function savePdf(path){const response=await authorizedFetch(path);if(!response.ok){const data=await response.json().catch(()=>({}));const e=Error(data.error||'下載未完成，請重試');e.status=response.status;throw e;}const blob=await response.blob();if(!blob.size)throw Error('檔案尚未取得，請重試');const header=response.headers.get('Content-Disposition')||'';let name='Bibliotheca.pdf';const utf=header.match(/filename\*=UTF-8''([^;]+)/i),plain=header.match(/filename="([^"]+)"/i);try{name=utf?decodeURIComponent(utf[1]):plain?.[1]||name;}catch{}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}


const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let me,data,pdfjs,page=1,loading=false;
async function api(path,body){return remoteApi(path,body);}
async function display(n){if(loading)return;loading=true;$('prev').disabled=$('next').disabled=true;$('status').textContent='正在載入第 '+n+' 頁…';$('page').hidden=true;let doc;try{const response=await authorizedFetch('/api/page?'+new URLSearchParams({ticket:params.get('ticket'),page:n}));if(!response.ok){const e=await response.json();throw Error(e.error||'無法載入此頁');}const bytes=new Uint8Array(await response.arrayBuffer());doc=await pdfjs.getDocument({data:bytes,isEvalSupported:false,useSystemFonts:true,cMapUrl:'https://tianyan-books.yao98r.chatgpt.site/assets/cmaps/',cMapPacked:true,standardFontDataUrl:'https://tianyan-books.yao98r.chatgpt.site/assets/standard_fonts/',wasmUrl:'https://tianyan-books.yao98r.chatgpt.site/assets/wasm/',disableAutoFetch:true,disableStream:true}).promise;const source=await doc.getPage(1),initial=source.getViewport({scale:1}),width=Math.min(1160,Math.max(320,innerWidth-24)),scale=Math.min(2,width/initial.width)*(devicePixelRatio>1?Math.min(2,devicePixelRatio):1),viewport=source.getViewport({scale}),canvas=$('page');canvas.width=viewport.width;canvas.height=viewport.height;canvas.style.width=Math.round(viewport.width/Math.min(2,devicePixelRatio||1))+'px';await source.render({canvasContext:canvas.getContext('2d'),viewport}).promise;page=n;$('number').value=n;canvas.hidden=false;$('status').textContent='';$('reload').style.display='none';}catch(e){$('status').textContent=e.message;$('reload').style.display='inline-block';}finally{await doc?.destroy();loading=false;$('prev').disabled=page<=1;$('next').disabled=page>=data.pages;}}
try{me=await api('/api/me');if(location.pathname.endsWith('/access.html')){const result=await api('/api/prepare',{csrf:me.csrf,bookId:params.get('book'),action:params.get('action')||'open',...(params.get('asset')?{asset:params.get('asset')}:{})});location.replace(result.url);}else{data=await api('/api/viewer?ticket='+encodeURIComponent(params.get('ticket')||''));$('title').textContent=data.title;document.title=data.title+' · Bibliotheca';$('total').textContent='共 '+data.pages+' 頁';$('number').max=data.pages;$('controls').hidden=$('note').hidden=false;$('download').hidden=!data.canDownload;pdfjs=await import('https://tianyan-books.yao98r.chatgpt.site/assets/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://tianyan-books.yao98r.chatgpt.site/assets/pdf.worker.min.mjs';await display(1);}}
catch(e){if(e.status===401)requireLogin();$('title').textContent='目前無法開啟';$('status').textContent=e.message;}
$('prev').onclick=()=>display(page-1);$('next').onclick=()=>display(page+1);$('reload').onclick=()=>display(Number($('number').value)||page);$('number').onchange=()=>{const n=Number($('number').value);if(Number.isInteger(n)&&n>=1&&n<=data.pages)display(n);else $('number').value=page;};
$('download').onclick=async()=>{const popup=window.open('about:blank','_blank');if(popup)popup.opener=null;$('download').disabled=true;try{const result=await api('/api/viewer/download',{csrf:me.csrf,ticket:params.get('ticket')});if(popup)popup.location=result.url;else location.href=result.url;}catch(e){popup?.close();$('status').textContent=e.message;}finally{$('download').disabled=false;}};
</script></body></html>
