<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>開啟天河增強系統 · 天眼</title><style>body{font:16px system-ui;color:#244d43;background:#f5f7f3;margin:0;padding:12vh 24px}main{max-width:580px;margin:auto;padding:30px;border:1px solid #ceded2;border-radius:12px;background:white}h1{font-size:25px}p{line-height:1.8}a{color:#244d43}button{background:#244d43;color:white;padding:13px 20px;border:0;border-radius:6px;font-size:15px;cursor:pointer}[hidden]{display:none!important}</style></head><body><main><h1>天河增強系統</h1><p id="status" role="status">正在沿用天眼帳號確認增強權限…</p><button id="retry" hidden>重新確認</button><p><a href="./">返回天眼書庫</a></p></main><script>
const BACKEND='https://bibliotheca-backend.bibliotheca-cloudflare.workers.dev',KEY='bibliotheca-cloudflare-session-v1';
const requested=new URLSearchParams(location.search).get('site')||'https://tianyan-pdf-enhance-01.tsea-6580.chatgpt.site';
async function openPortal(){const status=document.getElementById('status'),retry=document.getElementById('retry');retry.hidden=true;try{
 if(!/^https:\/\/tianyan-pdf-enhance-(0[1-9]|10)\.tsea-6580\.chatgpt\.site$/.test(requested))throw Error('增強系統入口無效。');
 let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null');}catch{}
 if(!saved?.token||saved.expiresAt<=Date.now()/1000){location.replace('./?return='+encodeURIComponent('enhance.html?site='+encodeURIComponent(requested)));return;}
 async function api(path,body){const r=await fetch(BACKEND+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+saved.token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,credentials:'omit',cache:'no-store',redirect:'error'}),data=await r.json();if(!r.ok){const e=Error(data.error||'暫時無法確認天眼權限');e.status=r.status;throw e;}return data;}
 const me=await api('/api/me');const grant=await api('/api/enhance/portal',{csrf:me.csrf,audience:requested});if(grant.url!==requested+'/studio'||typeof grant.token!=='string')throw Error('授權回應無效。');location.replace(grant.url+'#tianhe='+encodeURIComponent(grant.token));
 }catch(error){if(error.status===401){localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);location.replace('./?return='+encodeURIComponent('enhance.html?site='+encodeURIComponent(requested)));return;}status.textContent=error.message;retry.hidden=false;}}
document.getElementById('retry').onclick=openPortal;openPortal();
</script></body></html>
